# Builds and checks every pull request (Dependabot's too) the same way Release
# does before publishing, so a change that would break the release fails here.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Validate composer.json
        run: composer validate

      - name: Lint
        run: for f in src/*.php; do php -l "$f"; done
